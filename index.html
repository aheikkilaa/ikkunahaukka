<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ikkunahaukka</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #f1f7ff;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      background-color: #0078d7;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    header img {
      height: 50px;
      margin-right: 15px;
    }

    header h1 {
      color: white;
      font-size: 24px;
      margin: 0;
    }

    header p {
      color: #e0ecff;
      font-size: 14px;
      margin: 0;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .hero h2 {
      font-size: 28px;
      font-weight: 700;
    }

    .hero p {
      font-size: 22px;
      margin: 20px auto;
      max-width: 800px;
    }

    .profile-image {
      display: block;
      margin: 40px auto;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      background-color: #e6f0ff;
      margin-top: 80px;
    }

    footer p {
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <img src="ikkunahaukka2.png" alt="Ikkunahaukka logo" />
    <div>
      <h1>Ikkunahaukka</h1>
      <p>Ikkunanpesua Kotkan alueella</p>
    </div>
  </header>

  <section class="hero">
    <h2>Luotettavaa ikkunanpesua nopeasti ja ammattitaidolla</h2>
    <p>Tarjoamme ikkunanpesupalveluja Kotkan alueen koteihin ja yrityksiin. Ota yhteyttä ja pyydä tarjous!</p>

    <img src="ikkunanpesija.png" alt="Ikkunanpesijä työssään" class="profile-image" />
  </section>

  <footer>
    <p>&copy; 2025 Ikkunahaukka – kaikki oikeudet pidätetään.</p>
  </footer>

</body>
</html>
