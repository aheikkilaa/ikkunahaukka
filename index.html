<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ikkunahaukka – Ikkunanpesua Kotkan alueella</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #f5f9ff;
      color: #1a1a1a;
    }

    .topbar {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0.7rem 2rem;
      gap: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 999;
      flex-wrap: wrap;
    }

    .logo {
      height: 210px;
      max-width: 100%;
    }

    .tagline {
      font-size: 2rem;
      font-weight: 700;
      color: #0072ce;
    }

    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
    }

    h3 {
      color: #0072ce;
      margin-bottom: 1rem;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .button-group button {
      width: auto;
      margin-right: 1rem;
    }

    #thank-you-message {
      display: none;
      color: green;
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="https://aheikkilaa.github.io/ikkunahaukka/">
      <img src="ikkunahaukka2.png" alt="Ikkunahaukka logo" class="logo animate__animated animate__fadeInDown">
    </a>
    <div class="tagline animate__animated animate__fadeInRight">Ikkunat haukan nopeasti puhtaaksi!</div>
  </div>

  <div class="form-container">
    <form id="multiStepForm">
      <h3>Ota yhteyttä ja pyydä ilmainen tarjous!</h3>

      <!-- Step 1 -->
      <div class="form-step active">
        <label>Valitse kohde:</label>
        <div class="button-group">
          <button type="button" onclick="setField('kohde','Omakotitalo')">Omakotitalo</button>
          <button type="button" onclick="setField('kohde','Rivi/paritalo')">Rivi/paritalo</button>
          <button type="button" onclick="setField('kohde','Kerrostalo')">Kerrostalo</button>
        </div>
        <input type="hidden" name="Kohde" id="kohde">
        <button type="button" onclick="nextStep()">Jatka</button>
      </div>

      <!-- Step 2 -->
      <div class="form-step">
        <label>Mitkä pinnat haluat pestä?</label>
        <select name="Pestavat pinnat" required>
          <option value="Ulkopinnat">Ulkopinnat</option>
          <option value="Sisäpinnat">Sisäpinnat</option>
          <option value="Kaikki pinnat">Kaikki pinnat</option>
        </select>
        <button type="button" onclick="nextStep()">Seuraava</button>
      </div>

      <!-- Step 3 -->
      <div class="form-step">
        <label>Normaalit 4-pintaiset ikkunat</label>
        <input type="number" name="4-pintaiset ikkunat" min="0">

        <label>Normaalit 6-pintaiset ikkunat</label>
        <input type="number" name="6-pintaiset ikkunat" min="0">

        <label>Tuuletusikkunat</label>
        <input type="number" name="Tuuletusikkunat" min="0">

        <label>Ovet</label>
        <input type="number" name="Ovet" min="0">

        <label>Kääntyvät parvekelasit</label>
        <input type="number" name="Parvekelasit" min="0">

        <label>Muut ikkunat tai erityistoiveet</label>
        <textarea name="Erityisikkunat" placeholder="Erikoispyynnöt tai muut ikkunatyypit"></textarea>

        <button type="button" onclick="nextStep()">Seuraava</button>
      </div>

      <!-- Step 4 -->
      <div class="form-step">
        <label>Osoite</label>
        <input type="text" name="Osoite" required>

        <label>Postinumero</label>
        <input type="text" name="Postinumero" required>

        <label>Postitoimipaikka</label>
        <input type="text" name="Postitoimipaikka" required>

        <label>Etunimi</label>
        <input type="text" name="Etunimi" required>

        <label>Sukunimi</label>
        <input type="text" name="Sukunimi" required>

        <label>Puhelinnumero</label>
        <input type="tel" name="Puhelin" required>

        <label>Sähköpostiosoite</label>
        <input type="email" name="Sähköposti" required>

        <label>Viesti (valinnainen)</label>
        <textarea name="Viesti"></textarea>

        <button type="submit">Lähetä</button>
      </div>

      <div id="thank-you-message">Kiitos yhteydenotosta. Pyrimme vastaamaan haukan nopeudella!</div>

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_autoresponse" value="Kiitos viestistäsi! Otamme sinuun pian yhteyttä.">
      <input type="hidden" name="_next" value="https://aheikkilaa.github.io/ikkunahaukka/">
    </form>
  </div>

  <script>
    const steps = document.querySelectorAll('.form-step');
    let currentStep = 0;

    function nextStep() {
      if (currentStep < steps.length - 1) {
        steps[currentStep].classList.remove('active');
        currentStep++;
        steps[currentStep].classList.add('active');
      }
    }

    function setField(id, value) {
      document.getElementById(id).value = value;
    }

    document.getElementById('multiStepForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      const thankYou = document.getElementById('thank-you-message');

      fetch("https://formsubmit.co/OMA_SÄHKÖPOSTISI", {
        method: "POST",
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          form.reset();
          steps[currentStep].classList.remove('active');
          currentStep = 0;
          steps[0].classList.add('active');
          thankYou.style.display = 'block';
        } else {
          alert("Valitettavasti lähetys ei onnistunut. Yritä myöhemmin uudelleen.");
        }
      }).catch(() => {
        alert("Verkkovirhe. Tarkista yhteys ja yritä uudelleen.");
      });
    });
  </script>
</body>
</html>
