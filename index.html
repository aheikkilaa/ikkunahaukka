<<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ikkunahaukka – Ikkunanpesua Kotkan alueella</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f5f9ff;
      color: #1a1a1a;
    }

    .topbar {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0.7rem 2rem;
      gap: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 999;
      flex-wrap: wrap;
    }

    .logo {
      height: 210px;
      max-width: 100%;
    }

    .tagline {
      font-size: 2rem;
      font-weight: 700;
      color: #0072ce;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    section.hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 3rem 2rem;
    }

    .hero-text {
      flex: 1;
      min-width: 250px;
      text-align: left;
    }

    .hero-text h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .hero-text p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .hero-image {
      flex: 1;
      min-width: 250px;
      display: flex;
      justify-content: center;
    }

    .hero-image img {
      width: 400px;
      height: 400px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .form-section {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.07);
    }

    .form-section h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      color: #0072ce;
    }

    .form-section input,
    .form-section textarea,
    .form-section select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-section button {
      background-color: #0072ce;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-section button:hover {
      background-color: #005fa3;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #e8f0fa;
      margin-top: 3rem;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .topbar {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.5rem;
        padding: 1rem;
      }

      .logo {
        height: 140px;
      }

      .tagline {
        font-size: 1.5rem;
      }

      section.hero {
        flex-direction: column-reverse;
        padding: 2rem 1rem;
      }

      .hero-text, .hero-image {
        width: 100%;
        text-align: center;
      }

      .hero-text h2 {
        font-size: 1.5rem;
      }

      .hero-text p {
        font-size: 1rem;
      }

      .hero-image img {
        width: 250px;
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/">
      <img src="logo.png" alt="Ikkunahaukka logo" class="logo">
    </a>
    <div class="tagline">Ikkunanpesua Kotkan alueella</div>
  </div>

  <section class="hero">
    <div class="hero-text">
      <h2>Tervetuloa Ikkunahaukalle</h2>
      <p>Tarjoamme ammattitaitoista ikkunanpesua Kotkan seudulla. Täytä lomake ja pyydä ilmainen tarjous!</p>
    </div>
    <div class="hero-image">
      <img src="hero-kuva.jpg" alt="Ikkunanpesukuva">
    </div>
  </section>

  <section class="form-section">
    <h3>Ota yhteyttä ja pyydä ilmainen tarjous!</h3>
    <!-- Lomake tulee tähän -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="nimi" placeholder="Etunimi ja sukunimi" required>
      <input type="email" name="sahkoposti" placeholder="Sähköpostiosoite" required>
      <textarea name="viesti" rows="5" placeholder="Kirjoita viestisi tähän..." required></textarea>
      <button type="submit">Lähetä</button>
    </form>
  </section>

  <footer>
    &copy; 2025 Ikkunahaukka. Kaikki oikeudet pidätetään.
  </footer>
</body>
</html>
